<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Radio Station</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            color: #ff4757;
            margin-bottom: 24px;
            font-size: 1.8rem;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 25px;
            border: none;
            background-color: #ff4757;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.8;
        }
        #status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #ccc;
            line-height: 1.6;
            min-height: 50px;
            background: #252525;
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📻 AI Radio Station</h1>
        
        <div class="input-group">
            <label>OpenAI API Key</label>
            <input type="password" id="openaiApiKey" placeholder="sk-...">
        </div>

        <button id="startBtn" onclick="startRadio()">ラジオを起動する</button>
        <button id="talkBtn" onclick="generateAiTalk()" style="display:none; background-color: #2ed573;">🎙️ DJにトークさせる</button>

        <div id="status">OpenAI API Keyを入力して「ラジオを起動する」を押してください</div>
    </div>

    <!-- BGM用オーディオ -->
    <audio id="bgm" loop src="https://actions.google.com/sounds/v1/ambiences/coffee_shop.ogg"></audio>

    <script>
        function startRadio() {
            const openaiKey = document.getElementById('openaiApiKey').value;
            if (!openaiKey) {
                alert("OpenAI API Keyを入力してください");
                return;
            }

            // BGM再生
            const bgm = document.getElementById('bgm');
            bgm.volume = 0.2;
            bgm.play().catch(e => console.log("BGM再生失敗:", e));

            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('talkBtn').style.display = 'block';
            document.getElementById('status').innerText = "ラジオ放送中！\n「DJにトークさせる」を押すとAIが喋り出します。";
        }

        async function generateAiTalk() {
            const openaiKey = document.getElementById('openaiApiKey').value;
            const statusDiv = document.getElementById('status');

            statusDiv.innerText = "🤔 DJが原稿を考えています...";

            try {
                // OpenAI Chat Completion API
                const gptResponse = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${openaiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: [
                            { role: 'system', content: 'あなたは深夜ラジオの明るく親しみやすいラジオDJです。聴衆に向けて挨拶と、心が温まるようなショートトークを2〜3文で軽快に話してください。' }
                        ]
                    })
                });

                const gptData = await gptResponse.json();
                if (gptData.error) {
                    throw new Error(gptData.error.message);
                }
                const talkScript = gptData.choices[0].message.content;

                statusDiv.innerText = `🎙️ 【DJトーク中】\n「${talkScript}」`;

                // OpenAI TTS API (音声合成)
                const ttsResponse = await fetch('https://api.openai.com/v1/audio/speech', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${openaiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'tts-1',
                        input: talkScript,
                        voice: 'alloy'
                    })
                });

                if (!ttsResponse.ok) {
                    throw new Error("音声合成エラー");
                }

                const blob = await ttsResponse.blob();
                const audioUrl = URL.createObjectURL(blob);
                const audio = new Audio(audioUrl);
                
                // トーク中はBGMの音量を少し下げる
                const bgm = document.getElementById('bgm');
                bgm.volume = 0.05;
                
                audio.play();
                audio.onended = () => {
                    bgm.volume = 0.2; // トークが終わったらBGMの音量を戻す
                    statusDiv.innerText = "ラジオ放送中！\n「DJにトークさせる」を押すと再度喋ります。";
                };

            } catch (err) {
                console.error(err);
                statusDiv.innerText = "❌ エラーが発生しました。API Keyに間違いがないか確認してください。";
            }
        }
    </script>
</body>
</html>
